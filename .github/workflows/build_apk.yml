name: Build APK

on:
  push:
    branches: [main, ragheb]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      # ✅ موبايلات حديثة — 64-bit ARM (2018+)
      - name: Upload arm64 APK (موبايلات حديثة)
        uses: actions/upload-artifact@v4
        with:
          name: "v${{ github.run_number }}-arm64-موبايلات-حديثة"
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      # ⬇️ موبايلات قديمة — 32-bit ARM
      - name: Upload armeabi APK (موبايلات قديمة)
        uses: actions/upload-artifact@v4
        with:
          name: "v${{ github.run_number }}-armeabi-موبايلات-قديمة"
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
